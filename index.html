<style>

footer{padding:30px 0 20px;color:var(--mute);font-size:.82rem;text-align:center}
footer b{color:var(--ink)}
.toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-20px);opacity:0;background:var(--forest);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;transition:.3s;font-weight:700;font-size:.9rem;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#58d68d;margin-right:6px;animation:pl 1.6s infinite}

.modal{position:fixed;inset:0;background:rgba(5,15,10,.6);z-index:70;display:none;align-items:flex-end;justify-content:center}

<script>
const S={get(k,d){try{const v=localStorage.getItem('avp_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('avp_'+k,JSON.stringify(v))}catch(e){}}};
let L=S.get('lang','es');const t=(es,en)=>L==='en'?en:es;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const nf=(n,d=0)=>isFinite(n)?Number(n).toLocaleString(L==='en'?'en-US':'es-CO',{maximumFractionDigits:d}):'—';
const money=n=>isFinite(n)?'$'+nf(Math.round(n)):'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
const bog=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'America/Bogota'}));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(bog());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const fdate=s=>new Date(s+'T12:00:00').toLocaleDateString(L==='en'?'en-US':'es-CO',{day:'numeric',month:'short',year:'numeric'});

const UI={
 demoBar:['DEMO · Propuesta de Vibras Positivas HM para Agroventure Capital · No es una app oficial · Datos de ejemplo','DEMO · Vibras Positivas HM proposal for Agroventure Capital · Not an official app · Sample data'],
 appName:['Red de Productores','Grower Network'],
 heroT:['Tu fruta, de la finca a la empacadora','Your fruit, from farm to packhouse'],
 heroP:['La app para los productores que entregan arándano a la empacadora de Tocancipá: programa entregas con lote y QR, mira la calidad y lo que te van a pagar, y lleva al día lo que pide el ICA.','The app for growers delivering blueberries to the Tocancipá packhouse: schedule deliveries with lot and QR, see quality and what you’ll be paid, and keep ICA requirements up to date.'],
 nInicio:['Inicio','Home'],nEntregas:['Entregas','Deliveries'],nCalidad:['Calidad y pago','Quality & pay'],nIca:['ICA y campo','ICA & field'],nPanel:['Panel empresa','Company'],
 foot1:['Demo de Vibras Positivas HM preparada como propuesta para Agroventure Capital. No es una app oficial de Agroventure. Productores, precios y cifras de calidad son ficticios. Normas: Resolución ICA 824 de 2022.','Vibras Positivas HM demo prepared as a proposal for Agroventure Capital. Not an official Agroventure app. Growers, prices and quality figures are fictional. Rules: ICA Resolution 824 of 2022.']
};
function applyUI(){document.documentElement.lang=L;$$('[data-t]').forEach(e=>{const v=UI[e.dataset.t];if(v)e.textContent=v[L==='en'?1:0]});$('#btnEs').classList.toggle('on',L==='es');$('#btnEn').classList.toggle('on',L==='en')}

/* ===== DEMO DATA (ficticio) ===== */
function seed(){
  if(S.get('seeded',false))return;
  const td=today();
  S.set('prod',{nombre:'Productor de ejemplo',finca:'Finca El Mirador (ejemplo)',municipio:'Guasca, Cundinamarca',alt:2750,ha:3,variedad:'Biloxi',plantas:9500,ica:'',asistente:'Ing. agrónomo de ejemplo',agua:addDays(td,-300),suelo:true});
  const L0=[];const kg=[310,355,402,388,420,455];const ex=[78,81,84,80,86,88];
  for(let i=0;i<6;i++){const f=addDays(td,-7*(6-i));L0.push({id:'L'+i,lote:'',fecha:f,kilos:kg[i],bandejas:Math.round(kg[i]/2),hora:'06:30',temp:14-i%3,estado:'recibida',rec:{kilos:kg[i]-4,exp:ex[i],causas:{blanda:4,calibre:5,partida:2,inmadura:2,deshid:1,mojada:0}}})}
  L0.push({id:'L6',lote:'',fecha:addDays(td,3),kilos:470,bandejas:235,hora:'06:00',temp:'',estado:'programada'});
  L0.forEach((x,i)=>x.lote=mkLote(x.fecha,i+1));
  S.set('lotes',L0);
  S.set('apps',[{id:1,fecha:addDays(td,-12),producto:'Fungicida para Botrytis (ejemplo)',ia:'Ingrediente de ejemplo',dosis:'1 L/ha',sector:'Lote 1',car:7,ica:true},{id:2,fecha:addDays(td,-1),producto:'Insecticida para trips (ejemplo)',ia:'Ingrediente de ejemplo',dosis:'0,5 L/ha',sector:'Lote 2',car:5,ica:true}]);
  S.set('precios',{exp:12000,nac:6000,tarifa:1500});
  S.set('ica',{});S.set('seeded',true);
}
function mkLote(f,n){return 'AVC-'+f.replace(/-/g,'').slice(2)+'-'+String(n).padStart(3,'0')}
const NET=[ // red de ejemplo para el panel (ficticia)
 ['Finca El Mirador (ejemplo)','Guasca',3,455,88],['La Esperanza (ejemplo)','Tocancipá',5,760,84],['Los Pinos (ejemplo)','Sesquilé',2,240,79],['San Isidro (ejemplo)','Chocontá',4,590,86],['Buenavista (ejemplo)','Villapinzón',6,880,82],['El Retiro (ejemplo)','Sopó',2.5,330,90],['La Cumbre (ejemplo)','Guatavita',3.5,410,77],['Santa Rita (ejemplo)','Ventaquemada',8,1150,85]
];
const CAUSAS=[['blanda',['Blanda','Soft']],['calibre',['Calibre menor a 10 mm','Under 10 mm']],['partida',['Partida','Split']],['inmadura',['Inmadura','Unripe']],['deshid',['Deshidratada','Dehydrated']],['mojada',['Mojada','Wet']]];

/* ===== HERO ===== */
const HERO=['img/cultivo-cubierto.jpg','img/cosecheros.jpg','img/racimo.jpg','img/huerto-otono.jpg','img/bayas.jpg'];let hi=0;
function buildHero(){$('#slides').innerHTML=HERO.map((h,i)=>`<img src="${h}" alt="" class="${i?'':'on'}">`).join('')}
setInterval(()=>{const im=$$('#slides img');if(!im.length)return;im[hi].classList.remove('on');hi=(hi+1)%im.length;im[hi].classList.add('on')},5200);

/* ===== cálculos ===== */
function lotes(){return S.get('lotes',[])}
function liq(l){const P=S.get('precios',{});if(!l.rec)return null;const k=l.rec.kilos,e=k*l.rec.exp/100,n=k-e;return{exp:e,nac:n,total:e*P.exp+n*P.nac-k*P.tarifa}}
function carenciaHasta(){const a=S.get('apps',[]);let max=null,who=null;a.forEach(x=>{const h=addDays(x.fecha,+x.car||0);if(!max||h>max){max=h;who=x}});return{max,who}}
function nextIcaReport(){const d=bog(),m=[1,4,7,10];for(let y=d.getFullYear();y<=d.getFullYear()+1;y++)for(const mm of m){const c=new Date(y,mm,1);if(c>=new Date(d.getFullYear(),d.getMonth(),1)){return iso(c)}}}
function aguaVence(){const p=S.get('prod',{});return p.agua?addDays(p.agua,365):null}

/* ===== INICIO ===== */
function renderInicio(){
  const p=S.get('prod',{}),Ls=lotes(),rec=Ls.filter(x=>x.rec),td=today();
  const mes=td.slice(0,7),recMes=rec.filter(x=>x.fecha.startsWith(mes));
  const kMes=recMes.reduce((s,x)=>s+x.rec.kilos,0),payMes=recMes.reduce((s,x)=>s+liq(x).total,0);
  const expAvg=rec.length?rec.reduce((s,x)=>s+x.rec.exp,0)/rec.length:NaN;
  const prox=Ls.filter(x=>x.estado==='programada').sort((a,b)=>a.fecha.localeCompare(b.fecha))[0];
  const car=carenciaHasta(),rep=nextIcaReport(),agua=aguaVence();
  const al=[];
  if(prox&&car.max&&car.max>prox.fecha)al.push(['d',t('Carencia: no puedes cosechar ese lote todavía','Pre‑harvest interval: you can’t pick that lot yet'),t(`La aplicación de "${car.who.producto}" tiene carencia hasta el ${fdate(car.max)} y la entrega ${prox.lote} está para el ${fdate(prox.fecha)}. Cambia la fecha o cosecha otro sector.`,`The "${car.who.producto}" spray has a pre‑harvest interval until ${fdate(car.max)} and delivery ${prox.lote} is set for ${fdate(prox.fecha)}. Change the date or pick another block.`)]);

function qrText(l){const p=S.get('prod',{});return `LOTE ${l.lote}\nFinca: ${p.finca}\nMunicipio: ${p.municipio}\nICA: ${p.ica||'-'}\nVariedad: ${p.variedad}\nCosecha: ${l.fecha} ${l.hora}\nKilos: ${l.kilos}\nTemp pulpa: ${l.temp===''?'-':l.temp+' C'}`}
function drawQR(id,txt){const el=document.getElementById(id);if(!el||typeof qrcode!=='function')return;try{const q=qrcode(0,'M');q.addData(unescape(encodeURIComponent(txt)));q.make();el.innerHTML=q.createSvgTag({cellSize:3,margin:2,scalable:true})}catch(e){}}

function renderCalidad(){
  const P=S.get('precios',{}),rec=lotes().filter(x=>x.rec).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const tot=rec.reduce((s,x)=>{const q=liq(x);s.k+=x.rec.kilos;s.e+=q.exp;s.p+=q.total;return s},{k:0,e:0,p:0});
  const cs={};CAUSAS.forEach(c=>cs[c[0]]=rec.length?rec.reduce((s,x)=>s+(x.rec.causas[c[0]]||0),0)/rec.length:0);
  const W=640,H=230,p=26,bw=(W-p*2)/Math.max(rec.length,1);
  const bars=rec.map((x,i)=>{const h=x.rec.exp/100*(H-70);return `<rect x="${p+i*bw+8}" y="${H-36-h}" width="${bw-16}" height="${h}" rx="7" fill="${x.rec.exp>=85?'var(--leaf)':x.rec.exp>=80?'#7cc08f':'var(--amber)'}"><animate attributeName="height" from="0" to="${h}" dur=".9s"/><animate attributeName="y" from="${H-36}" to="${H-36-h}" dur=".9s"/></rect><text x="${p+i*bw+bw/2}" y="${H-42-h}" font-size="24" font-weight="800" text-anchor="middle" fill="currentColor">${x.rec.exp}%</text><text x="${p+i*bw+bw/2}" y="${H-10}" font-size="19" text-anchor="middle" fill="currentColor">${new Date(x.fecha+'T12:00').toLocaleDateString(L==='en'?'en-US':'es-CO',{day:'numeric',month:'short'})}</text>`}).join('');
  const worst=Object.entries(cs).sort((a,b)=>b[1]-a[1])[0];
  const tip={blanda:t('Fruta blanda: cosecha temprano en la mañana, saca rápido al frío y no te pases de nitrógeno.','Soft fruit: pick early in the morning, cool fast and don’t overdo nitrogen.'),calibre:t('Calibre pequeño: revisa poda, polinización (abejas o abejorros) y riego.','Small size: check pruning, pollination (bees or bumblebees) and irrigation.'),partida:t('Fruta partida: riego parejo y no pasarse de potasio.','Split fruit: even watering and no excess potassium.'),inmadura:t('Fruta inmadura: cosecha solo la azul pareja y capacita a los cosecheros.','Unripe fruit: pick only evenly blue fruit and train pickers.'),deshid:t('Deshidratada: sombra en campo y enfriar en menos de 2 horas.','Dehydrated: field shade and cool within 2 hours.'),mojada:t('Mojada: no cosechar con rocío ni lluvia.','Wet: don’t pick with dew or rain.')}[worst[0]];
  $('#calidadOut').innerHTML=`<div class="kicker" style="color:var(--leaf)">${t('Calidad y pago','Quality & pay')}</div><h2>${t('Lo que llega, lo que se exporta y lo que te pagan','What arrives, what is exported and what you get paid')}</h2>
  <div class="card reveal"><div class="kv"><div><span>${t('Kilos recibidos','Kilos received')}</span><b>${nf(tot.k)}</b></div><div><span>${t('Kilos exportables','Exportable kilos')}</span><b>${nf(tot.e)}</b></div><div><span>${t('Exportable total','Total exportable')}</span><b>${nf(tot.e/tot.k*100,1)}%</b></div><div><span>${t('Pago estimado','Estimated pay')}</span><b>${money(tot.p)}</b></div></div></div>
  <div class="card reveal"><h3>${t('% exportable por entrega','% exportable per delivery')}</h3><svg viewBox="0 0 ${W} ${H}" style="width:100%;color:var(--mute)">${bars}</svg></div>
  <div class="card reveal"><h3>${t('¿Por qué se descarta tu fruta?','Why is your fruit rejected?')}</h3>${CAUSAS.map(c=>`<div style="margin:8px 0"><div class="row" style="flex-wrap:nowrap;justify-content:space-between"><b style="flex:1">${t(c[1][0],c[1][1])}</b><span style="flex:0 0 auto">${nf(cs[c[0]],1)}%</span></div><div class="bar"><i style="width:${cs[c[0]]/12*100}%;${c[0]===worst[0]?'background:var(--amber)':''}"></i></div></div>`).join('')}
  <div class="alert r" style="margin-top:12px"><b>${t('Tu principal causa','Your main cause')}: ${t(CAUSAS.find(c=>c[0]===worst[0])[1][0],CAUSAS.find(c=>c[0]===worst[0])[1][1])}</b>${tip}</div></div>
  <div class="card reveal"><h3>${t('Liquidación por lote','Settlement per lot')}</h3>${rec.slice().reverse().map(x=>{const q=liq(x);return `<div style="display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)"><div><b>${x.lote}</b><div class="muted">${fdate(x.fecha)} · ${nf(x.rec.kilos)} kg · ${nf(q.exp)} ${t('export','export')} · ${nf(q.nac)} ${t('nacional','domestic')}</div></div><b style="font-family:Fraunces,serif;font-size:1.1rem;white-space:nowrap">${money(q.total)}</b></div>`}).join('')}
  <div class="row" style="margin-top:12px"><div><label>${t('Precio exportable $/kg','Export price $/kg')}</label><input type="number" data-p="exp" value="${P.exp}"></div><div><label>${t('Precio nacional $/kg','Domestic price $/kg')}</label><input type="number" data-p="nac" value="${P.nac}"></div><div><label>${t('Tarifa de empaque $/kg','Packing fee $/kg')}</label><input type="number" data-p="tarifa" value="${P.tarifa}"></div></div>
  <p class="note">${t('Precios y tarifas FICTICIOS para la demo. En la app real los define Agroventure en su contrato con cada productor.','FICTIONAL prices and fees for the demo. In the real app Agroventure sets them in each grower’s contract.')}</p></div>`;
  $$('[data-p]').forEach(e=>e.onchange=()=>{const P=S.get('precios',{});P[e.dataset.p]=+e.value;S.set('precios',P);renderAll()});
  observe();
}

 ['agua','Análisis microbiológico del agua, mínimo una vez al año','Microbiological water test, at least yearly','Art. 13.1.17'],
 ['plag','Solo plaguicidas con registro ICA','Only ICA‑registered pesticides','Art. 13.1.18'],
 ['regs','Registros de aplicaciones, monitoreo de plagas y labores','Records of sprays, pest monitoring and field work','Art. 13.1.19'],

function renderIca(){
  const st=S.get('ica',{}),p=S.get('prod',{}),A=S.get('apps',[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)),td=today();
  const auto={agua:p.agua&&aguaVence()>=td,regs:A.length>0,rem:lotes().length>0,plag:A.length>0&&A.every(a=>a.ica)};

  $('#icaOut').innerHTML=`<div class="kicker" style="color:var(--leaf)">${t('ICA y campo','ICA & field')}</div><h2>${t('Al día con el ICA para exportar','ICA‑ready to export')}</h2><p class="sub">${t('Lo que pide la Resolución ICA 824 de 2022 al lugar de producción que vende fruta fresca para exportación.','What ICA Resolution 824 of 2022 requires from production sites selling fresh fruit for export.')}</p>
  <div class="card"><div class="row" style="align-items:center"><div><div class="big">${Math.round(done/ICA_ITEMS.length*100)}%</div><div class="muted">${done} ${t('de','of')} ${ICA_ITEMS.length} ${t('requisitos','requirements')}</div></div><div style="flex:2 1 200px"><div class="bar"><i style="width:${done/ICA_ITEMS.length*100}%"></i></div></div></div>
  ${ICA_ITEMS.map(i=>{const a=auto[i[0]];const on=st[i[0]]||a;return `<div class="chk ${on?'on':''}" data-i="${i[0]}"><div class="box"></div><div>${t(i[1],i[2])}<small>${i[3]}${a?' · '+t('se marca solo con tus registros','auto‑checked from your records'):''}</small></div></div>`}).join('')}</div>
  <div class="card"><h3>${t('Cuaderno de aplicaciones','Spray log')}</h3><p class="muted">${t('Cada aplicación queda con su carencia. La app no deja programar cosecha de un lote que todavía está en carencia.','Each spray carries its pre‑harvest interval. The app warns before scheduling a harvest still under interval.')}</p>
  ${A.map(a=>{const h=addDays(a.fecha,+a.car||0),act=h>=td;return `<div class="lot" style="grid-template-columns:1fr"><div><b>${esc(a.producto)}</b> <span class="tag ${act?'a':'g'}">${act?t('Carencia hasta ','Interval until ')+fdate(h):t('Libre para cosechar','Clear to harvest')}</span><div class="muted">${fdate(a.fecha)} · ${esc(a.ia)} · ${esc(a.dosis)} · ${esc(a.sector)} · ${t('carencia','interval')} ${a.car} ${t('días','days')}${a.ica?' · '+t('registro ICA','ICA registered'):''}</div></div></div>`}).join('')}
  <button class="btn ghost" style="width:100%;margin-top:12px" onclick="newApp()">${t('Anotar una aplicación','Log a spray')}</button></div>`;
  $$('#icaOut .chk').forEach(c=>c.onclick=()=>{if(auto[c.dataset.i])return toast(t('Este se marca con tus registros','This one comes from your records'));const s=S.get('ica',{});s[c.dataset.i]=!s[c.dataset.i];S.set('ica',s);renderIca()});
}
function newApp(){modal(`<h3>${t('Anotar una aplicación','Log a spray')}</h3>
  <div class="row"><div><label>${t('Fecha','Date')}</label><input id="af" type="date" value="${today()}"></div><div><label>${t('Sector o lote','Block')}</label><input id="as" value="Lote 1"></div></div>
  <div style="margin-top:10px"><label>${t('Producto comercial','Product')}</label><input id="ap"></div>
  <div class="row" style="margin-top:10px"><div><label>${t('Ingrediente activo','Active ingredient')}</label><input id="ai"></div><div><label>${t('Dosis','Rate')}</label><input id="ad"></div><div><label>${t('Carencia (días)','Interval (days)')}</label><input id="ac" type="number" value="7"></div></div>
  <label style="margin-top:12px;display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:.9rem"><input id="ar" type="checkbox" checked style="width:auto"> ${t('Tiene registro ICA','ICA registered')}</label>
  <button class="btn" style="width:100%;margin-top:14px" onclick="saveApp()">${t('Guardar','Save')}</button>`)}
function saveApp(){if(!$('#ap').value.trim())return toast(t('Escribe el producto','Enter the product'));const A=S.get('apps',[]);A.push({id:Date.now(),fecha:$('#af').value,producto:$('#ap').value,ia:$('#ai').value,dosis:$('#ad').value,sector:$('#as').value,car:+$('#ac').value||0,ica:$('#ar').checked});S.set('apps',A);closeModal();renderAll();toast(t('Aplicación anotada','Spray logged'))}

/* ===== PANEL EMPRESA ===== */
function renderPanel(){
  const ha=NET.reduce((s,x)=>s+x[2],0),kg=NET.reduce((s,x)=>s+x[3],0),ex=NET.reduce((s,x)=>s+x[3]*x[4],0)/kg;
  const weeks=[2900,3300,3650,3900,4150,4380,4600,4815];const W=640,H=230,p=24,bw=(W-p*2)/weeks.length,mx=6000;
  const bars=weeks.map((v,i)=>{const h=v/mx*(H-70);return `<rect x="${p+i*bw+8}" y="${H-36-h}" width="${bw-16}" height="${h}" rx="7" fill="${i===weeks.length-1?'var(--forest2)':'var(--leaf)'}"><animate attributeName="height" from="0" to="${h}" dur=".9s"/><animate attributeName="y" from="${H-36}" to="${H-36-h}" dur=".9s"/></rect><text x="${p+i*bw+bw/2}" y="${H-42-h}" font-size="21" font-weight="800" text-anchor="middle" fill="currentColor">${nf(v/1000,1)}</text><text x="${p+i*bw+bw/2}" y="${H-10}" font-size="19" text-anchor="middle" fill="currentColor">${t('S','W')}${i+1}</text>`}).join('');
  const sorted=NET.slice().sort((a,b)=>b[4]-a[4]);
  $('#panelOut').innerHTML=`<div class="kicker" style="color:var(--leaf)"><span class="pulse"></span>${t('Vista de Agroventure','Agroventure view')}</div><h2>${t('Toda la red en una pantalla','The whole network on one screen')}</h2><p class="sub">${t('Lo que vería la gerencia: cuánta fruta viene, de dónde, con qué calidad y cuánto de la empacadora se está usando. Datos de ejemplo.','What management would see: how much fruit is coming, from where, at what quality and how much packhouse capacity is used. Sample data.')}</p>
  <div class="card reveal"><div class="kv"><div><span>${t('Productores','Growers')}</span><b>${NET.length}</b></div><div><span>${t('Hectáreas en la red','Network hectares')}</span><b>${nf(ha,1)}</b></div><div><span>${t('Kilos esta semana','Kilos this week')}</span><b>${nf(kg)}</b></div><div><span>${t('Exportable ponderado','Weighted exportable')}</span><b>${nf(ex,1)}%</b></div></div>
  <p style="margin:14px 0 6px"><b>${t('Uso de la capacidad de la empacadora (500 ha)','Packhouse capacity use (500 ha)')}</b></p><div class="bar"><i style="width:${ha/500*100}%"></i></div><p class="muted" style="margin-top:6px">${nf(ha/500*100,1)}% · ${t('espacio para','room for')} ${nf(500-ha)} ${t('ha más de productores aliados','more ha of partner growers')}</p></div>
  <div class="card reveal"><h3>${t('Fruta recibida por semana (toneladas)','Fruit received per week (tonnes)')}</h3><svg viewBox="0 0 ${W} ${H}" style="width:100%;color:var(--mute)">${bars}</svg></div>
  <div class="card reveal"><h3>${t('Ranking de calidad','Quality ranking')}</h3>${sorted.map((x,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${i+1}. ${x[0]}</b><div class="muted">${x[1]} · ${nf(x[2],1)} ha · ${nf(x[3])} ${t('kg/semana','kg/week')}</div></div><span class="tag ${x[4]>=85?'g':x[4]>=80?'':'a'}" style="font-size:.9rem">${x[4]}%</span></div>`).join('')}</div>
  <div class="grid g2"><div class="card reveal"><h3>${t('Alertas de la red','Network alerts')}</h3><div class="alert r"><b>${t('2 fincas por debajo de 80% exportable','2 farms below 80% exportable')}</b>${t('Visita técnica sugerida: Los Pinos y La Cumbre (ejemplo).','Suggested technical visit: Los Pinos and La Cumbre (sample).')}</div><div class="alert"><b>${t('Informe trimestral ICA','Quarterly ICA report')}</b>${t('El próximo mes de reporte empieza el ','The next reporting month starts ')}${fdate(nextIcaReport())}.</div></div>
  <div class="card reveal"><h3>${t('Lo que gana Agroventure','What Agroventure gains')}</h3><ul style="margin:0;padding-left:18px"><li>${t('Trazabilidad lote por lote para exportadores y compradores.','Lot‑by‑lot traceability for exporters and buyers.')}</li><li>${t('Planear la empacadora con los kilos programados de toda la red.','Plan the packhouse with scheduled kilos from the whole network.')}</li><li>${t('Productores alineados con el ICA y las buenas prácticas.','Growers aligned with ICA and good practices.')}</li><li>${t('Reportes en español e inglés para inversionistas.','Spanish and English reports for investors.')}</li></ul></div></div>`;
  observe();
}

/* ===== infra ===== */
function modal(h){$('#modalBox').innerHTML=h+`<button class="btn ghost" style="width:100%;margin-top:10px" onclick="closeModal()">${t('Cerrar','Close')}</button>`;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function go(v){$$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));$$('nav.bot button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));window.scrollTo({top:0,behavior:'smooth'});S.set('view',v);observe()}
$$('nav.bot button').forEach(b=>b.onclick=()=>go(b.dataset.v));
let io;function observe(){if(!('IntersectionObserver'in window)){$$('.reveal').forEach(e=>e.classList.add('in'));return}io=io||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.06});$$('.reveal:not(.in)').forEach(e=>io.observe(e))}
function renderHero(){const d=bog();$('#heroDate').textContent=d.toLocaleDateString(L==='en'?'en-US':'es-CO',{weekday:'long',day:'numeric',month:'long'})+' · '+d.toLocaleTimeString(L==='en'?'en-US':'es-CO',{hour:'2-digit',minute:'2-digit'})+' (Bogotá)';
  const p=S.get('prod',{});$('#prodLbl').textContent=p.finca||'';
  const rec=lotes().filter(x=>x.rec);const tk=[[nf(lotes().length),t('lotes con QR','lots with QR')],[nf(rec.reduce((s,x)=>s+x.rec.kilos,0)),t('kilos entregados','kilos delivered')],['500 ha',t('capacidad empacadora','packhouse capacity')],['824/2022',t('Resolución ICA','ICA Resolution')]];
  $('#ticker').innerHTML=tk.map(x=>`<div class="tk"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}
function renderAll(){applyUI();renderHero();renderInicio();renderEntregas();renderCalidad();renderIca();renderPanel()}
$('#btnEs').onclick=()=>{L='es';S.set('lang',L);renderAll()};$('#btnEn').onclick=()=>{L='en';S.set('lang',L);renderAll()};
setInterval(renderHero,60000);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
seed();buildHero();renderAll();go(S.get('view','inicio'));
</script>
</body>
